# usage-limit.sh ayarları. Her anahtar aynı adlı ortam değişkeniyle de verilebilir.
# Otomatik duraklar (yüzde). 5 saatlik veya haftalık (tüm modeller) okuma bu değere ilk kez
# ulaşınca, o an konuşması olan her oturum bir kez durur ve devir notu yazar.
# STOP1_PCT=91: %90'ı geçince. STOP2_PCT=96: %95'i geçince.
# STOP1_PCT ve üstünde her cevabın sonunda uyarı ve yeni oturum prompt'u gelir.
STOP1_PCT=91
STOP2_PCT=96
# Okuma aralığı (dakika): en yüksek yüzde POLL_HIGH_FROM_PCT altındaysa LOW, üstündeyse HIGH.
POLL_LOW_MIN=10
POLL_HIGH_MIN=2
POLL_HIGH_FROM_PCT=75
# Boş = bu makinedeki tüm oturumlar. Test için oturum kimlikleri (boşlukla ayrılmış).
ONLY_SESSIONS=
# Kullanıcı mesajında geçerse bekleyen otomatik durak atlanır. Uyarılar sürer.
OVERRIDE_WORD=#limit-devam
