<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent Rules and Utilities</title>
  <desc id="desc">AI agent'ları için Türkçe kurallar, hook'lar ve araçlar. Sağda kurulum çıktısını gösteren bir terminal penceresi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#dots)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="64" y="86" width="64" height="6" rx="3" fill="url(#accent)"/>
    <text x="64" y="152" fill="#f8fafc" font-size="48" font-weight="700">AI Agent Rules</text>
    <text x="64" y="198" fill="#94a3b8" font-size="34" font-weight="600">and Utilities</text>
    <text x="64" y="252" fill="#cbd5e1" font-size="22">AI agent'ları için Türkçe kurallar,</text>
    <text x="64" y="284" fill="#cbd5e1" font-size="22">hook'lar ve araçlar.</text>
  </g>

  <g transform="translate(640 52)">
    <rect width="496" height="256" rx="14" fill="#0a0f1a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="26" cy="24" r="6" fill="#f87171"/>
    <circle cx="48" cy="24" r="6" fill="#fbbf24"/>
    <circle cx="70" cy="24" r="6" fill="#34d399"/>
    <line x1="0" y1="46" x2="496" y2="46" stroke="#1e293b" stroke-width="1.5"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
      <text x="24" y="84" fill="#94a3b8">$ <tspan fill="#e2e8f0">./install.sh</tspan></text>
      <text x="24" y="120" fill="#2dd4bf">✓ <tspan fill="#e2e8f0">kurallar ve skill'ler</tspan></text>
      <text x="24" y="150" fill="#2dd4bf">✓ <tspan fill="#e2e8f0">devir notu ve limit hook'ları</tspan></text>
      <text x="24" y="180" fill="#2dd4bf">✓ <tspan fill="#e2e8f0">secret-guard</tspan></text>
      <text x="24" y="210" fill="#2dd4bf">✓ <tspan fill="#e2e8f0">/oturum paneli</tspan></text>
      <text x="24" y="240" fill="#818cf8">→ <tspan fill="#94a3b8">testler geçti, kurulum tamam</tspan></text>
    </g>
  </g>
</svg>
