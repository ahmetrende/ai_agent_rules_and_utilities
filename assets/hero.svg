<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent Rules and Utilities</title>
  <desc id="desc">Claude Code ile günlük çalışmak için kurallar, hook'lar ve araçlar. Sağda dört bölüm: oturum paneli, devir notu ve gizli bilgi koruması, kurallar ve terimler, subagent yönlendirme.</desc>

  <rect width="1200" height="360" fill="#213b80"/>

  <g font-family="'Avenir Next', Avenir, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="72" fill="#c5d7ff" font-size="19" font-weight="600">ahmetrende / açık kaynak</text>
    <text x="64" y="160" fill="#ffffff" font-size="56" font-weight="700" letter-spacing="-1.2">AI Agent Rules</text>
    <text x="64" y="224" fill="#ffffff" font-size="56" font-weight="700" letter-spacing="-1.2">and Utilities</text>
    <text x="64" y="280" fill="#d1dfff" font-size="21">Claude Code ile günlük çalışmak için</text>
    <text x="64" y="310" fill="#d1dfff" font-size="21">kurallar, hook'lar ve araçlar.</text>
  </g>

  <g transform="translate(700 52)">
    <g stroke="#5971ab" stroke-width="2">
      <line x1="0" y1="0" x2="436" y2="0"/>
      <line x1="0" y1="64" x2="436" y2="64"/>
      <line x1="0" y1="128" x2="436" y2="128"/>
      <line x1="0" y1="192" x2="436" y2="192"/>
      <line x1="0" y1="256" x2="436" y2="256"/>
    </g>
    <g font-family="ui-monospace, Menlo, SFMono-Regular, Consolas, monospace" font-size="15" fill="#c5d7ff">
      <text x="0" y="24">/oturum</text>
      <text x="0" y="88">hooks/</text>
      <text x="0" y="152">AGENTS.md</text>
      <text x="0" y="216">agents/</text>
    </g>
    <g font-family="'Avenir Next', Avenir, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff">
      <text x="0" y="50">Oturum paneli</text>
      <text x="0" y="114">Devir notu ve gizli bilgi koruması</text>
      <text x="0" y="178">Kurallar ve terimler</text>
      <text x="0" y="242">Subagent yönlendirme</text>
    </g>
  </g>
</svg>
